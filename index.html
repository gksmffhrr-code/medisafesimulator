<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>메디세이프 현장 시뮬레이션 · 전산실 편</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ── 색 토큰: 브로셔(앞·뒷면)와 같은 팔레트 ── */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ffffff; --surface:#ffffff; --tint:#eef3ff; --tint-2:#e3ecff; --line:#d5dceb;
  --ink:#0f1b33; --sub:#3d4a63; --mute:#4a5568;
  --brand:#1b3f9e; --brand-deep:#122c73; --brand-ink:#1b3f9e;
  --on-brand:#ffffff; --on-brand-mid:#e6ecff; --on-brand-soft:#c7d5ff;
  --navy:#0f1b33; --on-navy:#ffffff; --on-navy-soft:#c7d5ff;
  --red:#b3261e; --red-tint:#fff7f5; --red-line:#f3d3cf;
  --gray-tint:#f3f5f9;
  --logo-bg:transparent;
  --shadow:0 10px 30px rgba(15,27,51,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1226; --surface:#101b36; --tint:#16264a; --tint-2:#1d3160; --line:#2b3c66;
    --ink:#eaf0ff; --sub:#b9c5e0; --mute:#97a5c6;
    --brand:#2a52c2; --brand-deep:#1b3f9e; --brand-ink:#9db8ff;
    --on-brand:#ffffff; --on-brand-mid:#e6ecff; --on-brand-soft:#c7d5ff;
    --navy:#1a2a52; --on-navy:#ffffff; --on-navy-soft:#c7d5ff;
    --red:#ff9a8f; --red-tint:#2e1618; --red-line:#5a2a2c;
    --gray-tint:#141f3c;
    --logo-bg:#ffffff;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0a1226; --surface:#101b36; --tint:#16264a; --tint-2:#1d3160; --line:#2b3c66;
  --ink:#eaf0ff; --sub:#b9c5e0; --mute:#97a5c6;
  --brand:#2a52c2; --brand-deep:#1b3f9e; --brand-ink:#9db8ff;
  --on-brand:#ffffff; --on-brand-mid:#e6ecff; --on-brand-soft:#c7d5ff;
  --navy:#1a2a52; --on-navy:#ffffff; --on-navy-soft:#c7d5ff;
  --red:#ff9a8f; --red-tint:#2e1618; --red-line:#5a2a2c;
  --gray-tint:#141f3c;
  --logo-bg:#ffffff;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:15px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere;
}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand-ink);outline-offset:2px;border-radius:8px}
[hidden]{display:none !important}

.wrap{max-width:780px;margin:0 auto;padding:0 20px}

/* ── 상단 고정 영역 ── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;height:56px}
.logo{display:inline-flex;align-items:center;background:var(--logo-bg);border-radius:8px;padding:3px 6px;margin-left:-6px}
.logo img{height:24px;width:auto;display:block}
.pill{font-size:12px;font-weight:700;color:var(--brand-ink);border:1px solid var(--brand-ink);border-radius:999px;padding:3px 11px;white-space:nowrap}
.bar .spacer{flex:1}
.link-btn{background:none;border:0;padding:8px 4px;font-size:13px;font-weight:500;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.link-btn:hover{color:var(--ink)}
.link-btn + .link-btn{margin-left:8px}
.logo{cursor:default;-webkit-tap-highlight-color:transparent;user-select:none}

/* 수용도 게이지 */
.gauge{padding:2px 0 12px}
.gauge-top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.gauge-label{font-size:12px;font-weight:700;color:var(--mute)}
.gauge-quote{font-size:14px;font-weight:900;color:var(--ink)}
.gauge-num{margin-left:auto;font-size:13px;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
.gauge-num b{font-size:20px;font-weight:900;color:var(--ink)}
.gauge-delta{font-size:12px;font-weight:900;border-radius:999px;padding:1px 8px;opacity:0;transition:opacity .2s}
.gauge-delta.show{opacity:1}
.gauge-delta.up{background:var(--tint-2);color:var(--brand-ink)}
.gauge-delta.down{background:var(--red-tint);color:var(--red);border:1px solid var(--red-line)}
.gauge-track{position:relative;height:12px;border-radius:999px;background:var(--tint)}
.gauge-fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--brand);transition:width .6s cubic-bezier(.2,.7,.2,1)}
.gauge-fill.low{background:var(--red)}
.gauge-target{position:absolute;top:-4px;bottom:-4px;left:70%;width:2px;background:var(--ink);border-radius:2px}
.gauge-scale{display:grid;grid-template-columns:25fr 25fr 20fr 30fr;margin-top:5px;font-size:11px;line-height:1.3;color:var(--mute)}
.gauge-scale span{padding-right:4px}
.gauge-scale span.on{color:var(--brand-ink);font-weight:700}
.gauge-scale span:last-child{border-left:2px solid var(--ink);padding-left:6px;margin-left:-1px}

#view{padding-top:28px;padding-bottom:72px;outline:none}

/* ── 브리핑(교육) ── */
.hero{background:var(--brand);color:var(--on-brand);border-radius:16px;padding:30px 32px 28px}
.hero .eyebrow{font-size:13px;font-weight:500;color:var(--on-brand-soft);letter-spacing:.02em}
.hero h1{font-size:clamp(26px,5.2vw,36px);font-weight:900;line-height:1.28;margin:10px 0 14px;text-wrap:balance}
.hero p{font-size:14.5px;line-height:1.7;color:var(--on-brand-mid);max-width:60ch}

.sec{margin-top:40px}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sec-h h2{font-size:20px;font-weight:900;line-height:1.3}
.sec-h .aside{font-size:12.5px;color:var(--mute)}

.traits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.trait{background:var(--tint);border-radius:12px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.trait .say{font-size:16px;font-weight:900;line-height:1.35}
.trait dl{margin:0;display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:1.55}
.trait dt{font-size:12px;font-weight:700;color:var(--brand-ink)}
.trait dd{margin:0;color:var(--sub)}

.core{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.core-card{border:2px solid var(--brand-ink);border-radius:12px;padding:18px 20px}
.core-card .k{font-size:12px;font-weight:700;color:var(--brand-ink)}
.core-card h3{font-size:18px;font-weight:900;line-height:1.35;margin:4px 0 8px}
.core-card p{font-size:13.5px;color:var(--sub);line-height:1.6}

.tbl-scroll{overflow-x:auto;margin-top:14px;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px;line-height:1.45;min-width:520px}
thead th{background:var(--navy);color:var(--on-navy);text-align:left;padding:10px 14px;font-weight:700}
thead th.ms{background:var(--brand)}
tbody td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:top}
tbody td:first-child{font-weight:700}
tbody td.now{color:var(--sub)}
tbody td.ms{background:var(--tint);font-weight:700;color:var(--brand-ink)}
.tbl-note{font-size:12.5px;color:var(--mute);margin-top:10px;line-height:1.6}

.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rule{padding:16px 18px;border-top:1px solid var(--line)}
.rule:nth-child(-n+2){border-top:0}
.rule:nth-child(odd){border-right:1px solid var(--line)}
.rule h3{font-size:15px;font-weight:900;line-height:1.4;margin-bottom:4px}
.rule p{font-size:13px;color:var(--sub);line-height:1.6}
.ban{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ban span{font-size:12px;font-weight:700;color:var(--red);background:var(--red-tint);border:1px solid var(--red-line);border-radius:999px;padding:2px 10px}

.faces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.face-item{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.face-item .face{flex-basis:64px;width:64px;height:64px}
.face-item b{display:block;font-size:14.5px;font-weight:900;line-height:1.3}
.face-item span{display:block;font-size:12.5px;line-height:1.5;color:var(--sub);margin-top:2px}
.startbox{margin-top:40px;background:var(--navy);color:var(--on-navy);border-radius:16px;padding:24px 26px}
.startbox h2{font-size:20px;font-weight:900}
.startbox .setting{font-size:13.5px;color:var(--on-navy-soft);margin-top:6px;line-height:1.65}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0 16px}
.mode{display:block;text-align:left;background:transparent;border:1.5px solid rgba(255,255,255,.28);border-radius:12px;padding:14px 16px;color:var(--on-navy)}
.mode .m-t{display:block;font-size:15px;font-weight:900}
.mode .m-d{display:block;font-size:12.5px;line-height:1.55;color:var(--on-navy-soft);margin-top:3px}
.mode[aria-pressed="true"]{background:#ffffff;border-color:#ffffff;color:#0f1b33}
.mode[aria-pressed="true"] .m-d{color:#3d4a63}
.cta{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 26px;border:0;border-radius:999px;background:var(--brand);color:var(--on-brand);font-size:16px;font-weight:900}
.cta:hover{background:var(--brand-deep)}
.startbox .cta{background:#ffffff;color:#0f1b33;width:100%}
.startbox .cta:hover{background:#e6ecff}
.best-rec{font-size:12.5px;color:var(--on-navy-soft);margin-top:12px;text-align:center;line-height:1.6}
.best-rec + .best-rec{margin-top:4px}

/* ── 시뮬레이션 ── */
.round-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.round-n{font-size:13px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
.round-n span{color:var(--mute);font-weight:500}
.dots{display:flex;gap:4px;margin-left:auto}
.dots i{width:9px;height:5px;border-radius:3px;background:var(--line)}
.dots i.done{background:var(--brand-ink)}
.dots i.now{background:var(--ink)}
.pill.tech{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.key-flag{font-size:12px;font-weight:700;color:var(--red);border:1px solid var(--red);border-radius:999px;padding:3px 11px}

.turn{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 150px)}
.turn .who{flex:0 0 38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
.turn.it .who{background:var(--navy);color:var(--on-navy)}
.face{flex:0 0 76px;width:76px;height:76px;border-radius:50%;line-height:0}
.face.lg{flex-basis:116px;width:116px;height:116px}
.face-svg{width:100%;height:100%;display:block;overflow:visible}
.turn.it{gap:14px}
.turn.it .col{flex:1;max-width:620px}
.turn.it .bubble{width:fit-content;max-width:100%}
.mood{display:inline-block;font-size:11.5px;font-weight:900;border-radius:999px;padding:1px 9px;margin-left:4px;vertical-align:1px}
.mood.neg{background:var(--red-tint);color:var(--red);border:1px solid var(--red-line)}
.mood.neu{background:var(--gray-tint);color:var(--mute);border:1px solid var(--line)}
.mood.pos{background:var(--tint-2);color:var(--brand-ink)}
.turn.me{flex-direction:row-reverse}
.turn.me .who{background:var(--brand);color:var(--on-brand)}
.turn .col{min-width:0;max-width:min(620px,calc(100% - 60px))}
.turn.me .col{display:flex;flex-direction:column;align-items:flex-end}
.bubble{border-radius:16px;padding:13px 17px;font-size:15.5px;line-height:1.7}
.turn.it .bubble{background:var(--tint);border-top-left-radius:4px}
.turn.me .bubble{background:var(--brand);color:var(--on-brand);border-top-right-radius:4px}
.name{font-size:12px;font-weight:700;color:var(--mute);margin-bottom:3px}
.turn.me .name{text-align:right}
.sys{font-size:13px;font-weight:700;color:var(--red);text-align:center;border:1px dashed var(--red);border-radius:12px;padding:10px;margin:6px 0 14px}

.ask{font-size:13px;font-weight:700;color:var(--mute);margin:22px 0 10px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ask .hint{font-weight:400;font-size:12px}
@media (hover:none){.ask .hint{display:none}}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14.5px;line-height:1.65;transition:border-color .15s, background .15s}
.opt:hover{border-color:var(--brand-ink);background:var(--tint)}
.opt-n{flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid var(--brand-ink);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;margin-top:1px}

.coach{border:1px solid var(--line);border-left:5px solid var(--mute);border-radius:12px;padding:15px 18px;margin:4px 0 0 130px;background:var(--surface)}
.coach-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:900;border-radius:999px;padding:2px 11px}
.coach .d{font-size:12.5px;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
.coach p{font-size:14px;line-height:1.7;color:var(--ink)}
.better{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.better .bh{font-size:12px;font-weight:700;color:var(--brand-ink);margin-bottom:3px}
.better p{font-size:13.5px;color:var(--sub)}

.g-best .badge, .badge.g-best{background:var(--brand);color:var(--on-brand)}
.g-ok .badge, .badge.g-ok{background:var(--tint-2);color:var(--brand-ink)}
.g-weak .badge, .badge.g-weak{background:var(--gray-tint);color:var(--mute);border:1px solid var(--line)}
.g-bad .badge, .badge.g-bad{background:var(--red-tint);color:var(--red);border:1px solid var(--red-line)}
.coach.g-best{border-left-color:var(--brand)}
.coach.g-ok{border-left-color:var(--brand-ink)}
.coach.g-weak{border-left-color:var(--mute)}
.coach.g-bad{border-left-color:var(--red);background:var(--red-tint)}

.next-row{display:flex;justify-content:flex-end;margin-top:22px}

/* ── 결과 ── */
.verdict{border-radius:16px;padding:28px 30px;color:var(--on-brand);background:var(--brand)}
.verdict.hold{background:var(--navy)}
.verdict.reject,.verdict.ended{background:var(--red-tint);color:var(--ink);border:1.5px solid var(--red)}
.verdict .tag{display:inline-block;font-size:12px;font-weight:900;border-radius:999px;padding:3px 12px;background:#ffffff;color:#0f1b33}
.verdict.reject .tag,.verdict.ended .tag{background:var(--red);color:#fff}
:root[data-theme="dark"] .verdict.reject .tag,:root[data-theme="dark"] .verdict.ended .tag{color:#2e1618}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .verdict.reject .tag,:root:not([data-theme="light"]) .verdict.ended .tag{color:#2e1618}}
.verdict-top{display:flex;gap:22px;align-items:center;margin-bottom:16px}
.verdict-top .face{flex-basis:132px;width:132px;height:132px}
.verdict h1{font-size:clamp(24px,4.8vw,32px);font-weight:900;line-height:1.3;margin:12px 0 0}
.verdict blockquote{margin:0;padding:14px 18px;border-radius:12px;background:rgba(255,255,255,.12);font-size:15px;line-height:1.75}
.verdict.reject blockquote,.verdict.ended blockquote{background:var(--surface);border:1px solid var(--red-line)}
.verdict blockquote cite{display:block;font-style:normal;font-size:12px;font-weight:700;opacity:.8;margin-bottom:4px}
.verdict .note{font-size:14px;line-height:1.7;margin-top:14px;opacity:.95}

.score{display:grid;grid-template-columns:auto 1fr;gap:18px 28px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin-top:14px}
.score .big{font-size:13px;font-weight:700;color:var(--mute);line-height:1.3}
.score .big b{display:block;font-size:40px;font-weight:900;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.score .big small{font-size:14px;font-weight:700;color:var(--mute)}
.sheet{display:flex;flex-wrap:wrap;gap:6px}
.sheet i{font-style:normal;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
.sheet i.g-best{background:var(--brand);color:var(--on-brand)}
.sheet i.g-ok{background:var(--tint-2);color:var(--brand-ink)}
.sheet i.g-weak{background:var(--gray-tint);color:var(--mute);border:1px solid var(--line)}
.sheet i.g-bad{background:var(--red-tint);color:var(--red);border:1px solid var(--red)}
.sheet i.g-none{background:transparent;color:var(--line);border:1px dashed var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute);margin-top:8px}

.review{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--surface);overflow:hidden}
.review summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;font-size:14.5px;font-weight:700;line-height:1.45}
.review summary::-webkit-details-marker{display:none}
.review summary .rn{flex:0 0 auto;font-size:12px;font-weight:900;color:var(--mute);font-variant-numeric:tabular-nums;width:20px}
.review summary .rt{flex:1}
.review summary::after{content:"";flex:0 0 8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);margin:-4px 4px 0 2px;transition:transform .15s}
.review[open] summary::after{transform:rotate(-135deg);margin-top:4px}
.review .body{padding:2px 16px 16px 46px;font-size:13.5px;line-height:1.7}
.review .lbl{font-size:12px;font-weight:700;color:var(--mute);margin:12px 0 2px}
.review .lbl.b{color:var(--brand-ink)}
.review .q{color:var(--sub)}
.review .why{color:var(--ink)}
.review.locked{opacity:.6}
.review.locked summary{cursor:default}
.review.locked summary::after{display:none}

.sheet-card{background:var(--tint);border-radius:12px;padding:20px 22px}
.nb{white-space:nowrap}
.one-line{font-size:18px;font-weight:900;line-height:1.5;color:var(--ink);text-wrap:balance}
.cheat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.cheat .c{border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.cheat .c.wide{grid-column:1 / -1}
.cheat h3{font-size:14px;font-weight:900;margin-bottom:8px}
.cheat ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.7;color:var(--sub)}
.cheat li+li{margin-top:4px}
.req{background:var(--navy);color:var(--on-navy);border-radius:12px;padding:18px 22px;margin-top:14px}
.req h3{font-size:16px;font-weight:900}
.req p{font-size:13.5px;color:var(--on-navy-soft);line-height:1.7;margin-top:6px}
.req .items{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.req .items span{font-size:12.5px;font-weight:700;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px 11px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.ghost{min-height:50px;padding:0 24px;border-radius:999px;border:1.5px solid var(--brand-ink);background:transparent;color:var(--brand-ink);font-size:15px;font-weight:700}
.ghost:hover{background:var(--tint)}


/* 시작 상자: 선택 항목 */
.pick-h{font-size:12px;font-weight:700;color:var(--on-navy-soft);margin:18px 0 8px}
.startbox .modes{margin:0 0 4px}
.startbox .cta{margin-top:18px}
.sub-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ghost-w{min-height:46px;border-radius:999px;border:1.5px solid rgba(255,255,255,.4);background:transparent;color:#fff;font-size:14.5px;font-weight:700;padding:0 18px}
.ghost-w:hover{background:rgba(255,255,255,.1)}
.foot{font-size:12px;color:var(--mute);text-align:center;margin-top:28px}
.hero.slim{padding:24px 28px}
.hero.slim h1{font-size:clamp(24px,4.6vw,30px);margin:6px 0 8px}
.actions.top{margin-top:16px}
.cert-hint{font-size:13px;color:var(--mute);margin-top:12px}
.req .ghost-w{margin-top:14px}

/* 수료 화면 */
.cert-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:var(--mute)}
input[type=text],textarea,select{font:inherit;font-size:15px;font-weight:400;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;line-height:1.6}
input:focus,textarea:focus,select:focus{outline:3px solid var(--brand-ink);outline-offset:1px;border-color:var(--brand-ink)}
.cert{border:2px solid var(--brand-ink);border-radius:16px;padding:24px 26px;background:var(--surface)}
.cert-top{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--brand-ink)}
.cert-mark{background:var(--brand);color:var(--on-brand);border-radius:999px;padding:3px 14px;font-weight:900}
.cert-name{font-size:30px;font-weight:900;line-height:1.3;margin:14px 0 16px}
.cert-name small{display:block;font-size:14px;font-weight:500;color:var(--sub);margin-top:2px}
.cert-name em{font-style:normal;color:var(--line);font-size:22px}
.cert-dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;border-top:1px solid var(--line);padding-top:14px}
.cert-dl dt{font-size:12px;font-weight:700;color:var(--mute)}
.cert-dl dd{margin:0;font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums}

/* 현장 카드의 양식 */
.form-box{border:1px solid var(--line);border-radius:12px;padding:20px 22px;background:var(--surface)}
.form-box h3{font-size:17px;font-weight:900}
.form-d{font-size:13px;color:var(--sub);margin:4px 0 14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.wide{grid-column:1 / -1}
.out-l{margin-top:14px}
.out{background:var(--tint);border-color:transparent;font-size:13.5px}
.form-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.cta.sm,.ghost.sm{min-height:42px;font-size:14px;padding:0 20px;display:inline-flex;align-items:center;text-decoration:none}
.form-msg{font-size:12.5px;color:var(--brand-ink);font-weight:700}

/* 말하기 연습 */
.speak-box{border:2px dashed var(--brand-ink);border-radius:14px;padding:22px 24px;margin-top:18px;text-align:center}
.speak-box h3{font-size:18px;font-weight:900;line-height:1.4}
.speak-box p{font-size:13.5px;color:var(--sub);margin:6px auto 16px;max-width:52ch}
.self{display:flex;gap:10px;flex-wrap:wrap}

/* 검수용 */
.verify-list{margin:0;padding-left:22px;font-size:13.5px;line-height:1.6}
.verify-list li{margin-bottom:8px}
.verify-list li b{display:block}
.verify-list li span{color:var(--sub)}
.rv{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;background:var(--surface)}
.rv-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px}
.rv-h .rn{font-size:12px;font-weight:900;color:var(--mute)}
.rv-line{font-size:14px;line-height:1.65;background:var(--tint);border-radius:10px;padding:10px 14px;margin:10px 0}
.rv em{font-style:normal;font-size:11.5px;font-weight:900;color:var(--mute);margin-right:6px}
.rv-verify{font-size:13px;line-height:1.6;color:var(--red);background:var(--red-tint);border:1px solid var(--red-line);border-radius:10px;padding:8px 12px;margin-bottom:10px}
.rv-verify b{margin-right:6px}
.rv-opt{border-top:1px dashed var(--line);padding:10px 0 4px;font-size:13.5px;line-height:1.65}
.rv-opt p{margin-top:4px}
.rv-opt .rv-t{color:var(--ink)}
.rv-opt .rv-r,.rv-opt .rv-c{color:var(--sub);font-size:13px}
.rv-opt.g-best .rv-t{font-weight:700}

@media print{
  .top,.actions,.foot{display:none !important}
  body{font-size:11pt}
  .rv{break-inside:avoid}
  .hero{color:#000;background:#fff;border:2px solid #000}
  .hero p,.hero .eyebrow{color:#000}
}

/* 등장 모션: 사용자의 선택에 대한 응답에만 사용 */
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pop{animation:pop .28s ease-out both}
.pop.d1{animation-delay:.35s}
.pop.d2{animation-delay:.8s}
.pop.d3{animation-delay:1.05s}
@keyframes shake{0%,100%{transform:none}15%{transform:translateX(-4px) rotate(-2deg)}30%{transform:translateX(4px) rotate(2deg)}45%{transform:translateX(-3px) rotate(-1.5deg)}60%{transform:translateX(3px) rotate(1.5deg)}80%{transform:translateX(-1px)}}
.shake{animation:shake .6s ease-in-out .7s both}
@media (prefers-reduced-motion: reduce){
  .pop,.shake{animation:none}
  .gauge-fill{transition:none}
}

@media (max-width:720px){
  body{font-size:15px}
  .wrap{padding:0 16px}
  .hero{padding:24px 22px}
  .traits,.core,.cheat,.modes{grid-template-columns:1fr}
  .rules{grid-template-columns:1fr}
  .rule:nth-child(-n+2){border-top:1px solid var(--line)}
  .rule:first-child{border-top:0}
  .rule:nth-child(odd){border-right:0}
  .pill{display:none}
  .bar{height:50px}
  .tbl-scroll{overflow:visible;border:0;border-radius:0}
  table{min-width:0;display:block}
  thead{display:none}
  tbody{display:flex;flex-direction:column;gap:10px}
  tbody tr{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  tbody td{border-top:0;padding:10px 12px}
  tbody td:first-child{grid-column:1 / -1;background:var(--navy);color:var(--on-navy);padding:8px 12px}
  tbody td.now::before,tbody td.ms::before{display:block;font-size:11px;font-weight:700;margin-bottom:2px;color:var(--mute)}
  tbody td.now::before{content:"지금"}
  tbody td.ms::before{content:"도입 후";color:var(--brand-ink)}
  .dots{margin-left:0;flex:1 0 100%}
  .dots i{flex:1}
  .bubble{font-size:15px}
  .turn .col{max-width:calc(100% - 48px)}
  .coach{margin-left:0}
  .face{flex-basis:58px;width:58px;height:58px}
  .face.lg{flex-basis:92px;width:92px;height:92px}
  .turn.it{gap:10px}
  .turn.it .col{max-width:none}
  .faces{grid-template-columns:1fr 1fr;gap:8px}
  .face-item{flex-direction:column;text-align:center;gap:6px;padding:12px 8px}
  .verdict-top{flex-direction:column;align-items:flex-start;gap:12px}
  .verdict-top .face{flex-basis:auto;width:104px;height:104px}
  .cert-form,.form-grid,.cert-dl{grid-template-columns:1fr}
  .cert{padding:20px}
  .cert-name{font-size:26px}
  .form-box{padding:18px 16px}
  .hero.slim{padding:22px 20px}
  .self .cta,.self .ghost{flex:1 1 100%}
  .actions .cta,.actions .ghost{flex:1 1 100%}
  .link-btn{font-size:12.5px}
  .score{grid-template-columns:1fr}
  .review .body{padding-left:16px}
  .next-row .cta{width:100%}
  .gauge-scale{font-size:10.5px}
  .startbox{padding:22px 20px}
  .verdict{padding:24px 22px}
}
</style>
</head>

     이 함수 안에서 서버(Supabase 등)로 보내면 됩니다. 호출 지점: run_start / answer / run_end / speak_end */
  function track(event, data){

  const signed = (n) => { const r = Math.round(n); return (r>0?'+':(r<0?'−':'±')) + Math.abs(r); };
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const bestOf = (r) => r.options.find(o => o.grade === 'best');
  const curRound = () => ROUNDS[S.set[S.pos]];

  /* ── 답변 순서: 접속 기기마다 다르고, 도전할 때마다 다시 바뀜 ── */
  function randomKey(){
    const a = new Uint32Array(2);
    try{ crypto.getRandomValues(a); }catch(e){ a[0] = Math.random()*4294967296; a[1] = Math.random()*4294967296; }
    return (a[0].toString(16).padStart(8,'0') + a[1].toString(16).padStart(8,'0')).toUpperCase();
  }
  let memDevice = null;

    let d = lsGet(DEVICE);

    d.runs = d.runs | 0;
    return d;
  }
  function putDevice(d){ memDevice = d; lsSet(DEVICE, d); }
  function hash32(str){ let h = 2166136261 >>> 0; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed){ let a = seed >>> 0; return function(){ a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function shuffleWith(a, rnd){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

    const orders = {}, bestPos = [];

      const r = ROUNDS[ri], bi = r.options.indexOf(bestOf(r));

      } while(salt < 8 && n >= 2 && order.indexOf(bi) === bestPos[n-1] && bestPos[n-1] === bestPos[n-2]);

    });

  /* 단축 모드: 첫 문항·승부처·마무리는 항상 포함, 기술 질문은 최소 2개 */
  function pickShort(key, run){
    const rnd = rng(hash32(key + ':short:' + run));
    const last = ROUNDS.length - 1;
    const must = ROUNDS.map((r,i)=>i).filter(i => i===0 || i===last || ROUNDS[i].key);

    const others = shuffleWith(rest.filter(i => !tech.includes(i)), rnd).slice(0, Math.max(0, CONFIG.shortCount - must.length - tech.length));
    return must.concat(tech, others).sort((a,b)=>a-b);
  }

        <div class="faces">${Object.keys(FACES).map(k => `<div class="face-item"><div class="face">${faceSVG(k)}</div><div><b>${FACES[k].label}</b><span>${FACES[k].when}</span></div></div>`).join('')}</div>

        <div class="pick-h">진행 방식</div>

          <button class="mode" data-k="kind" data-v="short" aria-pressed="${S.kind==='short'}"><span class="m-t">단축 ${CONFIG.shortCount}문항</span><span class="m-d">약 8분. 매번 다른 문항이 섞여 나옵니다. 승부처는 항상 포함됩니다.</span></button>

        ${best ? `<p class="best-rec">이 기기의 최고 기록(전체 문항) · 수용도 ${best.gauge} (${best.tag})</p>` : ``}
      </section>
      ${footer()}`;
    if(S.kind==='retry') S.kind = 'full';
    $$('.mode', view).forEach(b => b.addEventListener('click', () => {
      S[b.dataset.k] = b.dataset.v;
      $$(`.mode[data-k="${b.dataset.k}"]`, view).forEach(x => x.setAttribute('aria-pressed', String(x===b)));
    }));
    $('#startBtn').addEventListener('click', () => startRun(S.kind==='short' ? 'short' : 'full'));
    $('#speakBtn').addEventListener('click', () => startSpeak());
    $('#cardBtn2').addEventListener('click', renderCard);
  }

  /* ══ 2. 시뮬레이션 ══ */
  function startRun(kind, set){
    const dev = getDevice(); dev.runs += 1; putDevice(dev);
    S.kind = kind;
    S.set = kind==='retry' ? set : (kind==='short' ? pickShort(dev.key, dev.runs) : ROUNDS.map((_,i)=>i));
    S.unit = unitFor(S.set);
    S.pos = 0; S.gauge = START; S.answers = []; S.ended = false;
    S.orders = makeOrders(dev.key, dev.runs, S.set);
    track('run_start', { kind, mode:S.mode, n:S.set.length, run:dev.runs });
    show('sim'); paintGauge(); renderRound();
  }

  function roundHead(){
    const r = curRound();
    const dots = S.set.map((_,i)=>`<i class="${i<S.pos?'done':(i===S.pos?'now':'')}"></i>`).join('');
    return `<div class="round-h">
      <span class="round-n">질문 ${S.pos+1} <span>/ ${S.set.length}</span></span>
      <span class="pill ${r.tech?'tech':''}" style="display:inline-block">${r.theme}</span>
      ${(r.key && S.mode==='practice') ? `<span class="key-flag">승부처</span>` : ``}
      ${S.kind==='retry' ? `<span class="key-flag">오답 복습</span>` : ``}
      <span class="dots" aria-hidden="true">${dots}</span>
    </div>`;
  }

  function renderRound(){
    S.answered = false;
    const ri = S.set[S.pos], r = ROUNDS[ri], order = S.orders[ri];
    view.innerHTML = roundHead() + `
      <div id="thread" aria-live="polite">${itTurn(val(r.line, S.gauge), askFace())}</div>
      <div id="choice">
        <div class="ask">어떻게 답하시겠습니까? <span class="hint">숫자 키 1–4로도 고를 수 있습니다</span></div>
        <div class="opts">${order.map((oi,n)=>`<button class="opt" data-oi="${oi}"><span class="opt-n">${n+1}</span><span>${r.options[oi].text}</span></button>`).join('')}</div>
      </div>
      <div id="after"></div>`;
    $$('.opt', view).forEach(b => b.addEventListener('click', () => choose(+b.dataset.oi)));
    window.scrollTo(0,0);
    view.focus({preventScroll:true});
  }

  function choose(oi){
    if(S.answered) return; S.answered = true;
    const ri = S.set[S.pos], r = ROUNDS[ri], opt = r.options[oi], best = bestOf(r);
    const delta = scoreOf(r, opt);
    S.gauge = clamp(S.gauge + delta);
    const face = reactFace(opt, S.gauge);
    S.answers.push({ ri, oi, grade:opt.grade, delta, face });
    track('answer', { q:r.id, oi, grade:opt.grade, kind:S.kind, mode:S.mode });
    const last = S.pos === S.set.length-1;
    const dead = S.mode==='real' && S.gauge <= 0;
    if(dead) S.ended = true;

    $('#choice').remove();
    const thread = $('#thread');
    thread.insertAdjacentHTML('beforeend', meTurn(opt.text, 'pop') + itTurn(val(opt.react, S.gauge), face, 'pop d1', true));
    if(dead) thread.insertAdjacentHTML('beforeend', `<div class="sys pop d2">수용도가 0이 되었습니다. 전산팀장이 면담을 끝냈습니다.</div>`);

    const g = GRADE[opt.grade];
    let html = '';
    if(S.mode==='practice'){
      html += `<div class="coach ${g.cls} pop d2">
        <div class="coach-h"><span class="badge">${g.label}</span><span class="d">수용도 ${signed(delta)}</span></div>
        <p>${opt.coach}</p>
        ${opt.grade!=='best' ? `<div class="better"><div class="bh">더 나은 답</div><p>${best.text}</p></div>` : ``}
      </div>`;
    }
    html += `<div class="next-row pop ${S.mode==='practice'?'d3':'d2'}"><button class="cta" id="nextBtn">${(last||dead) ? '결과 보기' : '다음 질문 듣기'}</button></div>`;
    $('#after').innerHTML = html;
    $('#nextBtn').addEventListener('click', () => { if(last||dead) renderResult(); else { S.pos++; renderRound(); } });

    setTimeout(()=>paintGauge(delta), 380);
    const mine = $('#myTurn');
    if(mine) mine.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto':'smooth', block:'start' });
    setTimeout(()=>{ const n = $('#nextBtn'); if(n) n.focus({preventScroll:true}); }, 1150);
  }

  document.addEventListener('keydown', (e) => {
    if(S.screen!=='sim' || S.answered || e.metaKey || e.ctrlKey || e.altKey) return;
    const n = parseInt(e.key,10);
    if(n>=1 && n<=4){ const b = $$('.opt', view)[n-1]; if(b){ e.preventDefault(); b.click(); } }
  });

  /* ══ 3. 결과 ══ */
  function cheatHTML(){
    return `
      <div class="sheet-card"><p class="one-line">메디세이프는 <span class="nb">백업·복구</span> 솔루션이면서, <span class="nb">백업·복구</span> 책임을 계약으로 밖에 맡기는 것입니다.</p></div>
      <div class="cheat">
        <div class="c"><h3>그대로 쓰는 질문 세 가지</h3>
          <ul><li>백업본, 어디에 두셨습니까?</li><li>전체 복구에 얼마나 걸리는지 측정해 보셨습니까?</li><li>전산 담당은 몇 분이십니까?</li></ul></div>
        <div class="c"><h3>쓰지 않는 말</h3>
          <ul><li>즉시 복구, “4시간이면 됩니다” 같은 단정</li><li>연동 전혀 없음, 계약 후 할 일 없음</li><li>보안 전 영역 커버, 저렴 (→ 경제적)</li><li>“책임이 전혀 없습니다”, 확정되지 않은 도입 사례</li></ul></div>
        <div class="c wide"><h3>기술·계약 질문을 받았을 때</h3>
          <ul><li>확정된 사실은 그 자리에서 말한다 — 하루 한 번 백업(잠정, 계약 시 확정) · 복구는 히포크랏랩스가 수행, 24시간 대응 · ISO/IEC 27001·27017·27018·27799 인증 · 데이터는 국내에 서버를 둔 아마존·구글 클라우드에 분산 저장 · 원본은 병원에 남고 메디세이프는 사본 · 네트워크 이중화는 병원이 직접 갖추는 항목(대신 구축하지 않음)</li><li>모르는 것은 지어내지 않는다 — 기술 수치, 복구 방식, 보상·해지 조건, 원가와 마진, 확인 안 된 인증(ISMS-P 보유 여부), 회사의 다른 사업</li><li>질문을 받아 적어 설명회 전에 기술진에게 전달한다 — 계약 조건은 말이 아니라 조항으로 보여 준다</li></ul></div>
      </div>`;
  }

  function renderResult(){
    show('result');
    const g = Math.round(S.gauge), n = S.set.length;
    const count = { best:0, ok:0, weak:0, bad:0 };
    S.answers.forEach(a => { count[a.grade==='vbad' ? 'bad' : a.grade]++; });
    const wrong = S.answers.filter(a => a.grade!=='best').map(a => a.ri);
    S.lastWrong = wrong;

    let kind, v;
    if(S.kind==='retry'){
      kind = count.best===n ? 'accept' : (count.best >= n/2 ? 'hold' : 'reject');
      v = { tag:'오답 복습', head:`${n}문항 중 ${count.best}문항을 정확히 답했습니다`,
            quote: count.best===n ? '이번에는 막히는 데가 없으시네요.' : '아직 걸리는 데가 있습니다.',
            note: count.best===n ? '틀렸던 문항을 모두 바로잡았습니다. 실전 모드·전체 문항으로 수료에 도전해 보십시오.' : '남은 문항은 아래 복기에서 ‘더 나은 답’을 소리 내어 읽어 본 뒤 다시 풀어 보십시오.' };
    } else {
      kind = S.ended ? 'ended' : (g >= TARGET ? 'accept' : (g >= HOLD ? 'hold' : 'reject'));
      v = VERDICTS[kind];
      if(S.kind==='full') saveBest({ gauge:g, tag:v.tag });
    }
    track('run_end', { kind:S.kind, mode:S.mode, gauge:g, verdict:kind, best:count.best, n });
    const certOK = S.kind==='full' && S.mode==='real' && kind==='accept';

    const sheet = S.set.map((ri,i) => { const a = S.answers[i];
      return `<i class="${a ? GRADE[a.grade].cls : 'g-none'}" title="${a ? GRADE[a.grade].label : '듣지 못함'}">${i+1}</i>`; }).join('');
    const reviews = S.set.map((ri,i) => {
      const r = ROUNDS[ri], a = S.answers[i];
      if(!a) return `<details class="review locked"><summary onclick="return false"><span class="rn">${i+1}</span><span class="rt">면담이 끝나 듣지 못한 질문</span></summary></details>`;
      const opt = r.options[a.oi], best = bestOf(r), gr = GRADE[a.grade];
      return `<details class="review" ${a.grade!=='best'?'open':''}>
        <summary><span class="rn">${i+1}</span><span class="rt">“${r.title}”</span><span class="badge ${gr.cls}">${gr.label}</span></summary>
        <div class="body">
          <div class="lbl">내가 한 답 <span class="mood ${MOOD[a.face]}">전산팀장 ${FACES[a.face].label}</span></div><div class="q">${opt.text}</div>
          <div class="lbl">해설</div><div class="why">${opt.coach}</div>
          ${a.grade!=='best' ? `<div class="lbl b">더 나은 답</div><div class="q">${best.text}</div>` : ``}
        </div></details>`;
    }).join('');

    view.innerHTML = `
      <section class="verdict ${kind}">
        <div class="verdict-top">
          <div class="face">${faceSVG(({accept:'delighted',hold:'bored',reject:'annoyed',ended:'furious'})[kind])}</div>
          <div><span class="tag">${v.tag}</span><h1>${v.head}</h1></div>
        </div>
        <blockquote><cite>전산팀장</cite>${v.quote}</blockquote>
        <p class="note">${v.note}</p>
      </section>

      <div class="score">
        <div class="big">최종 수용도<b>${g}<small> / 100</small></b>${S.kind==='retry' ? '복습 점수' : '수락 기준 ' + TARGET}</div>
        <div>
          <div class="sheet" aria-label="질문별 결과">${sheet}</div>
          <div class="legend"><span>정확 ${count.best}</span><span>무난 ${count.ok}</span><span>아쉬움 ${count.weak}</span><span>위험 ${count.bad}</span></div>
        </div>
      </div>

      ${certOK ? `<section class="sec" id="certSec"></section>` : (S.kind!=='retry' && kind==='accept' ? `<p class="cert-hint">수료 화면은 <b>실전 모드 · 전체 ${ROUNDS.length}문항</b>으로 수락을 받으면 나옵니다.</p>` : ``)}

      <div class="actions top">
        ${wrong.length ? `<button class="cta" id="wrongBtn">틀린 ${wrong.length}문항만 다시 풀기</button>` : ``}
        <button class="${wrong.length?'ghost':'cta'}" id="retryBtn">처음부터 다시 하기</button>
        <button class="ghost" id="speakBtn">말하기 연습</button>
      </div>

      <section class="sec">
        <div class="sec-h"><h2>복기</h2><span class="aside">‘정확’이 아니었던 답은 펼쳐 두었습니다</span></div>
        ${reviews}
      </section>

      <section class="sec">
        <div class="sec-h"><h2>현장에 가져갈 것</h2></div>
        ${cheatHTML()}
        <div class="req">
          <h3>${kind==='accept' ? '수락을 받았다면 제품설명회를 요청합니다' : '현장에서 수락을 받으면 제품설명회를 요청합니다'}</h3>
          <p>${CONFIG.owner}에게 병원명 · 병상수 · 결정권자(직책) · 현재 백업 방식 · 희망 시기 · 미팅 방법을 전달하면 설명회 방식(줌 추천 · 대면)을 정해 안내합니다.</p>
          <button class="ghost-w" id="reqBtn">제품설명회 요청 양식 열기</button>
        </div>
        <div class="actions"><button class="ghost" id="briefBtn">브리핑으로 돌아가기</button></div>
      </section>
      ${footer()}`;
    if(wrong.length) $('#wrongBtn').addEventListener('click', () => startRun('retry', wrong.slice().sort((a,b)=>a-b)));
    $('#retryBtn').addEventListener('click', () => startRun(S.kind==='retry' ? 'full' : S.kind));
    $('#speakBtn').addEventListener('click', () => startSpeak(wrong.length ? wrong.slice().sort((a,b)=>a-b) : null));
    $('#briefBtn').addEventListener('click', renderIntro);
    $('#reqBtn').addEventListener('click', () => renderCard('reqForm'));
    if(certOK) renderCert(g, count.best);
    view.focus({preventScroll:true});
  }

  /* ── 수료 화면: 실전 모드 · 전체 문항 · 수락 ── */
  function renderCert(g, bestCount){
    const box = $('#certSec'), prof = lsGet(PROFILE) || { office:'', name:'' };
    const now = new Date(), pad = (x)=>String(x).padStart(2,'0');
    const stamp = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    box.innerHTML = `
      <div class="sec-h"><h2>수료 화면</h2><span class="aside">사무소와 이름을 넣고 이 화면을 캡처해 제출하십시오</span></div>
      <div class="cert-form">
        <label>사무소<input id="cOffice" type="text" autocomplete="organization" value="${esc(prof.office)}" placeholder="예: 서울2사업부 ○○사무소"></label>
        <label>이름<input id="cName" type="text" autocomplete="name" value="${esc(prof.name)}" placeholder="이름"></label>
      </div>
      <div class="cert" id="certCard"></div>`;
    const paint = () => {
      const office = $('#cOffice').value.trim(), name = $('#cName').value.trim();
      lsSet(PROFILE, { office, name });
      const dev = getDevice();
      const code = hash32([office, name, stamp, g, bestCount, dev.key, CONFIG.version].join('|')).toString(16).toUpperCase().padStart(8,'0');
      $('#certCard').innerHTML = `
        <div class="cert-top"><span class="cert-mark">수료</span><span>메디세이프 현장 시뮬레이션 · 전산실 편</span></div>
        <div class="cert-name">${name ? esc(name) : '<em>이름을 입력하세요</em>'}<small>${esc(office)}</small></div>
        <dl class="cert-dl">
          <div><dt>결과</dt><dd>실전 모드 · 전체 ${ROUNDS.length}문항 · 수락</dd></div>
          <div><dt>최종 수용도</dt><dd>${g} / 100 (정확 ${bestCount}문항)</dd></div>
          <div><dt>일시</dt><dd>${stamp}</dd></div>
          <div><dt>내용 기준일</dt><dd>${CONFIG.version}</dd></div>
          <div><dt>확인 코드</dt><dd>${code.slice(0,4)}-${code.slice(4)} · 기기 ${dev.key.slice(0,4)}</dd></div>
        </dl>`;
    };
    $('#cOffice').addEventListener('input', paint); $('#cName').addEventListener('input', paint); paint();
  }

  /* ══ 4. 현장 카드: 면담 직전 1분 복습 + 제품설명회 요청 + 새로 들은 반대 제보 ══ */
  function composeBox(id, title, desc, fields, build){
    return `<div class="form-box" id="${id}">
      <h3>${title}</h3><p class="form-d">${desc}</p>
      <div class="form-grid">${fields.map(f => f.type==='textarea'
        ? `<label class="wide">${f.label}<textarea data-f="${f.key}" rows="3" placeholder="${f.ph||''}"></textarea></label>`
        : (f.type==='select'
          ? `<label>${f.label}<select data-f="${f.key}">${f.options.map(o=>`<option>${o}</option>`).join('')}</select></label>`
          : `<label>${f.label}<input data-f="${f.key}" type="text" placeholder="${f.ph||''}"></label>`)).join('')}</div>
      <label class="wide out-l">보낼 내용<textarea class="out" readonly rows="7"></textarea></label>
      <div class="form-actions"><button class="cta sm" data-act="copy">내용 복사</button><a class="ghost sm" data-act="mail" href="#">메일 앱으로 보내기</a><span class="form-msg" role="status"></span></div>
    </div>`;
  }
  function wireCompose(id, subject, build){
    const box = $('#'+id); if(!box) return;
    const out = $('.out', box), msg = $('.form-msg', box), mail = $('[data-act=mail]', box);
    const read = () => { const o = {}; $$('[data-f]', box).forEach(el => o[el.dataset.f] = el.value.trim()); return o; };
    const paint = () => {
      out.value = build(read());
      mail.href = 'mailto:' + CONFIG.contactEmail + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(out.value);
    };
    $$('[data-f]', box).forEach(el => el.addEventListener('input', paint)); paint();
    $('[data-act=copy]', box).addEventListener('click', async () => {
      let ok = false;
      try{ await navigator.clipboard.writeText(out.value); ok = true; }catch(e){
        try{ out.focus(); out.select(); ok = document.execCommand('copy'); }catch(e2){ ok = false; }
      }
      msg.textContent = ok ? '복사했습니다. 메신저나 메일에 붙여 넣으세요.' : '복사가 막혀 있습니다. ‘보낼 내용’을 길게 눌러 직접 복사하세요.';
    });
  }

  function renderCard(focusId){
    show('card');
    view.innerHTML = `
      <section class="hero slim">
        <div class="eyebrow">면담 직전 1분 복습</div>
        <h1>현장 카드</h1>
        <p>전산실에 들어가기 전에 이 화면만 다시 보십시오. 아래에서 제품설명회를 요청하고, 현장에서 새로 들은 반대도 알려 주십시오.</p>
      </section>
      <section class="sec">${cheatHTML()}</section>
      <section class="sec">
        <div class="sec-h"><h2>수락을 받았다면</h2></div>
        ${composeBox('reqForm', '제품설명회 요청', `${CONFIG.owner}에게 전달됩니다. 기술 설명은 히포크랏랩스 기술진이 직접 합니다.`, [
          { key:'hospital', label:'병원명', ph:'예: ○○병원' }, { key:'beds', label:'병상수', ph:'예: 320' },
          { key:'dm', label:'결정권자(직책)', ph:'예: 전산팀장 ○○○' }, { key:'backup', label:'현재 백업 방식', ph:'예: 원내 NAS, EMR 업체 백업' },
          { key:'when', label:'희망 시기', ph:'예: 10월 둘째 주' }, { key:'how', label:'미팅 방법', type:'select', options:['줌(추천)','대면'] },
          { key:'q', label:'전산팀장이 미리 물어본 기술 질문', type:'textarea', ph:'예: 회선 1G, 야간 PACS 전송 23시~03시. 초기 전송 방식 문의' },
          { key:'me', label:'요청자(사무소 · 이름)', ph:'예: ○○사무소 홍길동' } ])}
      </section>
      <section class="sec">
        <div class="sec-h"><h2>새로운 반대를 들었다면</h2><span class="aside">보내 주신 내용은 다음 문항이 됩니다</span></div>
        ${composeBox('objForm', '현장에서 들은 반대·질문 제보', '이 시뮬레이션에 없는 반대나 기술 질문을 들었다면 그대로 적어 주십시오.', [
          { key:'who', label:'누가 (직책)', ph:'예: 전산팀장, 행정원장' }, { key:'size', label:'병원 규모', ph:'예: 250병상' },
          { key:'said', label:'들은 말 그대로', type:'textarea', ph:'예: “백업은 그룹웨어 업체에서 같이 해 주는데요”' },
          { key:'mine', label:'내가 한 답과 반응', type:'textarea', ph:'어떻게 답했고, 상대가 어떻게 반응했는지' },
          { key:'me', label:'제보자(사무소 · 이름)', ph:'예: ○○사무소 홍길동' } ])}
      </section>
      <div class="actions"><button class="cta" id="goStart">면담 연습하러 가기</button></div>
      ${footer()}`;
    wireCompose('reqForm', '[메디세이프] 제품설명회 요청', f =>
      `[메디세이프 제품설명회 요청]\n병원명: ${f.hospital}\n병상수: ${f.beds}\n결정권자(직책): ${f.dm}\n현재 백업 방식: ${f.backup}\n희망 시기: ${f.when}\n미팅 방법: ${f.how}\n사전 기술 질문: ${f.q}\n요청자: ${f.me}`);
    wireCompose('objForm', '[메디세이프] 현장 반대·질문 제보', f =>
      `[메디세이프 현장 반대·질문 제보]\n누가: ${f.who}\n병원 규모: ${f.size}\n들은 말: ${f.said}\n내 답과 반응: ${f.mine}\n제보자: ${f.me}\n(시뮬레이션 기준일 ${CONFIG.version})`);
    $('#goStart').addEventListener('click', renderIntro);
    if(typeof focusId === 'string'){ const el = $('#'+focusId); if(el) el.scrollIntoView({ block:'start' }); }
  }

  /* ══ 5. 말하기 연습: 고르는 것이 아니라 말로 꺼내는 훈련 ══ */
  const SP = { set:[], pos:0, ok:[], again:[] };
  function startSpeak(set){
    SP.set = (set && set.length) ? set : ROUNDS.map((_,i)=>i);
    SP.pos = 0; SP.ok = []; SP.again = [];
    show('speak'); renderSpeak();
  }
  function renderSpeak(){
    const ri = SP.set[SP.pos], r = ROUNDS[ri];
    view.innerHTML = `
      <div class="round-h">
        <span class="round-n">말하기 ${SP.pos+1} <span>/ ${SP.set.length}</span></span>
        <span class="pill ${r.tech?'tech':''}" style="display:inline-block">${r.theme}</span>
      </div>
      <div id="thread">${itTurn(val(r.line, 60), r.tech ? 'skeptical' : 'cold', '', true)}</div>
      <div class="speak-box">
        <h3>화면을 보지 말고, 소리 내어 답해 보십시오</h3>
        <p>객관식은 좋은 답을 알아보는 연습입니다. 현장에서는 보기 없이 말해야 합니다. 다 말한 뒤에 모범 답과 비교하십시오.</p>
        <button class="cta" id="revealBtn">다 말했습니다 · 모범 답 보기</button>
      </div>
      <div id="after"></div>`;
    $('#revealBtn').addEventListener('click', () => {
      const best = bestOf(r);
      $('.speak-box', view).remove();
      $('#after').innerHTML = `
        <div class="coach g-best pop" style="margin-left:0"><div class="coach-h"><span class="badge">모범 답</span></div><p>${best.text}</p>
          <div class="better"><div class="bh">왜 이 답인가</div><p>${best.coach}</p></div></div>
        <div class="ask">방금 한 말과 비교하면?</div>
        <div class="self"><button class="cta" data-s="ok">핵심을 말했다</button><button class="ghost" data-s="again">다시 연습이 필요하다</button></div>`;
      $$('.self button', view).forEach(b => b.addEventListener('click', () => {
        (b.dataset.s==='ok' ? SP.ok : SP.again).push(ri);
        if(SP.pos === SP.set.length-1) renderSpeakEnd(); else { SP.pos++; renderSpeak(); window.scrollTo(0,0); }
      }));
    });
    window.scrollTo(0,0);
  }
  function renderSpeakEnd(){
    track('speak_end', { n:SP.set.length, ok:SP.ok.length });
    view.innerHTML = `
      <section class="verdict ${SP.again.length ? 'hold' : 'accept'}">
        <div class="verdict-top"><div class="face">${faceSVG(SP.again.length ? 'curious' : 'pleased')}</div>
          <div><span class="tag">말하기 연습</span><h1>${SP.set.length}문항 중 ${SP.ok.length}문항은 말로 꺼낼 수 있습니다</h1></div></div>
        <p class="note">${SP.again.length ? '아래 문항은 모범 답을 소리 내어 두 번 읽은 뒤 다시 해 보십시오. 외우는 것이 아니라 순서(인정 → 사실 → 다음 단계)를 입에 붙이는 것이 목표입니다.' : '모든 문항을 말로 꺼낼 수 있습니다. 실전 모드·전체 문항으로 수료에 도전해 보십시오.'}</p>
      </section>
      ${SP.again.length ? `<section class="sec"><div class="sec-h"><h2>다시 연습할 문항</h2></div>
        ${SP.again.map(ri => `<details class="review"><summary><span class="rt">“${ROUNDS[ri].title}”</span></summary><div class="body"><div class="lbl b">모범 답</div><div class="q">${bestOf(ROUNDS[ri]).text}</div></div></details>`).join('')}</section>` : ``}
      <div class="actions top">
        ${SP.again.length ? `<button class="cta" id="againBtn">이 ${SP.again.length}문항만 다시 말해 보기</button>` : ``}
        <button class="${SP.again.length?'ghost':'cta'}" id="briefBtn">브리핑으로 돌아가기</button>
      </div>${footer()}`;
    if(SP.again.length) $('#againBtn').addEventListener('click', () => startSpeak(SP.again.slice()));
    $('#briefBtn').addEventListener('click', renderIntro);
    window.scrollTo(0,0);
  }

  /* ══ 6. 검수용 전체 문항: 주소 끝에 #review, 또는 로고를 5번 누르면 열림 ══ */
  function renderReview(){
    show('review');
    const flagged = ROUNDS.filter(r => r.verify);
    view.innerHTML = `
      <section class="hero slim">
        <div class="eyebrow">히포크랏랩스 · 법무 검수용</div>
        <h1>전체 문항과 정답</h1>
        <p>이 시뮬레이션의 ‘정확’ 답은 영업사원의 공식 화법이 됩니다. 사실과 다르거나 약속할 수 없는 표현이 있는지 확인해 주십시오. 문항 ${ROUNDS.length}개 · 확인 필요 ${flagged.length}건 · 내용 기준일 ${CONFIG.version}</p>
      </section>
      <section class="sec">
        <div class="sec-h"><h2>확인이 필요한 항목</h2></div>
        <ol class="verify-list">${ROUNDS.map((r,i)=> r.verify ? `<li><b>${i+1}번 “${r.title}”</b><span>${r.verify}</span></li>` : '').join('')}</ol>
      </section>
      <section class="sec">
        <div class="sec-h"><h2>문항 전체</h2><span class="aside">인쇄하면 모든 문항이 펼쳐진 채로 나옵니다</span></div>
        ${ROUNDS.map((r,i) => `<article class="rv">
          <div class="rv-h"><span class="rn">${i+1}</span><span class="pill ${r.tech?'tech':''}" style="display:inline-block">${r.theme}</span>${r.key?'<span class="key-flag">승부처</span>':''}<b>“${r.title}”</b></div>
          <p class="rv-line"><em>전산팀장</em> ${val(r.line, 60)}</p>
          ${r.verify ? `<p class="rv-verify"><b>확인 필요</b> ${r.verify}</p>` : ``}
          ${r.options.slice().sort((a,b)=> (a.grade==='best'?-1:0) - (b.grade==='best'?-1:0)).map(o => `<div class="rv-opt ${GRADE[o.grade].cls}">
            <div><span class="badge">${GRADE[o.grade].label}</span></div>
            <p class="rv-t">${o.text}</p>
            <p class="rv-r"><em>반응</em> ${val(o.react, 80)}</p>
            <p class="rv-c"><em>해설</em> ${o.coach}</p></div>`).join('')}
        </article>`).join('')}
      </section>
      <div class="actions"><button class="ghost" id="briefBtn">브리핑으로 돌아가기</button></div>
      ${footer()}`;
    $('#briefBtn').addEventListener('click', renderIntro);
  }

  /* ── 시작 ── */
  homeBtn.addEventListener('click', renderIntro);
  cardBtn.addEventListener('click', () => renderCard());
  let taps = 0, tapT = null;
  $('.logo').addEventListener('click', () => { taps++; clearTimeout(tapT); tapT = setTimeout(()=>taps=0, 1500); if(taps >= 5){ taps = 0; renderReview(); } });
  function route(){ const h = (location.hash||'').toLowerCase(); if(h==='#review') renderReview(); else if(h==='#card') renderCard(); else renderIntro(); }
  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
</html>

</body></html>
